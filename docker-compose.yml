name: Printyl Server

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - AUTH_ENABLED=${AUTH_ENABLED}
      - OIDC_ISSUER_URL=${OIDC_ISSUER_URL}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
    user: "1000:1000"
    volumes:
      - type: bind
        source: ./printyl
        target: /printyl
  latex:
    build:
      context: ./latex-instance
      dockerfile: Dockerfile
    user: "1000:1000"
    cap_drop:
      - ALL
    mem_limit: 512m
    volumes:
      - type: bind
        source: ./printyl/jobs
        target: /jobs

volumes:
  server-data:
